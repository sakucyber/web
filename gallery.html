[data-theme="light"] .hero-bg::after{background:linear-gradient(180deg,rgba(254,246,255,.3) 0%,rgba(254,246,255,.6) 50%,var(--bg) 100%)}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 24px}

.hero h1 .accent{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;animation:gradShift 4s ease infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero p{font-size:1rem;color:rgba(255,255,255,.7);max-width:500px;margin:0 auto}
[data-theme="light"] .hero p{color:var(--text-secondary)}

main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:60px 32px 80px}
.gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gal-item{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;cursor:pointer;transition:transform .5s var(--ease-spring),box-shadow .5s}
.gal-item:hover{transform:scale(1.06) translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.4);z-index:2}
.gal-item img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease-out-expo)}
.gal-item:hover img{transform:scale(1.15)}
.gal-item .ov{position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,121,176,.35),rgba(192,132,252,.35));display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
.gal-item:hover .ov{opacity:1}
.gal-item .ov i{font-size:1.8rem;color:#fff;transform:scale(0) rotate(-45deg);transition:transform .5s var(--ease-spring)}
.gal-item:hover .ov i{transform:scale(1) rotate(0)}
@media(max-width:900px){.gal-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){main{padding:40px 16px 60px}.gal-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
