<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var t=localStorage.getItem('blog-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>404 · 这个页面走丢了</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="stylesheet" href="/assets/theme.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wrap{position:relative;z-index:2;max-width:520px}
.code{font-family:var(--font-display);font-size:clamp(4rem,18vw,8rem);line-height:1;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h1{font-family:var(--font-display);font-size:clamp(1.4rem,4vw,2rem);margin-bottom:12px}
p{color:var(--text-secondary);font-size:.92rem;line-height:1.9;margin-bottom:28px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.glow{position:fixed;width:520px;height:520px;border-radius:50%;background:var(--primary);filter:blur(160px);opacity:.18;pointer-events:none;top:-10%;right:-10%}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="particles" id="particles" data-particles="10" aria-hidden="true"></div>
<div class="wrap">
  <div class="code">404</div>
  <h1>这个页面走丢了 🌸</h1>
  <p>你要找的内容可能被搬走了，或者链接打错了一个字。<br>回首页看看吧，那里还在。</p>
  <div class="actions">
    <a href="/" class="btn-static">回到首页</a>
    <a href="/gallery.html" class="back-link" style="margin-top:0">逛逛画廊</a>
  </div>
</div>
<script src="/assets/theme.js" defer></script>
</body>
</html>
